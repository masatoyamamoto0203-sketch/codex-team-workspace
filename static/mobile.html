<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ケース在庫・スマホ</title><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="theme.css?v=3.0.2"><script src="backup.js?v=3.0.2" defer></script><script src="zxing.min.js" defer></script><script src="case-units.js?v=3.0.2" defer></script><script src="mobile.js?v=3.0.2" defer></script><main><header><small>食品工場 / V3.0.2 JFS-B運用支援</small><h1>ケース在庫</h1><p>ラベルを撮影して、使用数を記録</p><div class="backup-toolbar"><button type="button" data-backup-save aria-describedby="backupHelp">データを保存</button><p id="backupHelp">登録済みの在庫・商品・担当者・履歴をまとめてバックアップします。入力途中の内容は、各画面の登録・保存ボタンで確定してから押してください。</p><p id="backupStatus" role="status" aria-live="polite"></p></div></header><section><h2>1. ラベルを読み取る</h2><label class="capture">📷 カメラで撮影<input id="photo" type="file" accept="image/*" capture="environment"></label><form id="lookup"><label>番号を直接入力<input id="code" inputmode="numeric" pattern="[0-9]{13}" maxlength="13" placeholder="13桁の番号" required></label><button>番号で確認</button></form><p id="message" role="status"></p></section><section id="detail" hidden><h2 id="item"></h2><div id="info"></div><form id="move"><h2>2. 使った数量を入力</h2><label>担当者<select id="actor" required></select></label><label>操作<select id="kind"><option>使用</option><option>出荷</option><option>廃棄</option><option>棚卸し</option></select></label><label>数量の単位<select id="quantityMode"><option value="バラ">バラ</option><option value="ケース">ケース</option></select></label><label id="quantityLabel">使用数量（バラ）<input id="quantity" type="number" min="0.000001" step="any" required></label><label id="looseLabel" hidden>ケースに満たないバラ残数<input id="loose" type="number" min="0" step="0.000001" value="0"></label><p id="conversion"></p><label>理由・用途<input id="reason" maxlength="200" required placeholder="例：製造に使用"></label><label>使用部署・出荷先（使用・出荷時は必須）<input id="department" maxlength="40"></label><label>使用：製造ロット ／ 出荷：出荷伝票番号<input id="traceRef" maxlength="80"></label><button id="save">在庫に反映する</button></form><p id="result" role="status"></p></section><p class="foot">ケースのバーコードごとに残数を記録します。撮影だけでは数量は変わりません。<a href="/">パソコン用の全画面を開く</a></p></main></html>
